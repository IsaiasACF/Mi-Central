# Only repository-owned public assets. Never apply this policy to PHP or storage.
<Directory /var/www/html/public/assets>
    <FilesMatch "\.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$">
        Header set Cache-Control "public, max-age=300, s-maxage=3600" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 304"
    </FilesMatch>
</Directory>
